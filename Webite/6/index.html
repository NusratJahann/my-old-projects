<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Website</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap" rel="stylesheet">
</head>
<body>
    <div class="cursor" ></div>
    <nav>
        <h1 class="logo">logo</h1>
        <ul>
            <li><a href="#">Home</a></li>
            <li><a href="#">Services</a></li>
            <li><a href="#">About</a></li>
        </ul>
    </nav>
    <script>
        let mouseCursor = document.querySelector('.cursor');
        let nav = document.querySelectorAll('nav');
        window.addEventListener('mousemove', cursor);

        function cursor(window){
        mouseCursor.style.top = window.pageY + "px";
        mouseCursor.style.left = window.pageX + "px";
        }

        nav.forEach(link => {
        link.addEventListener('mouseleave', () => {
        mouseCursor.classList.remove("greyscale");
        });
        link.addEventListener('mouseover', () => {
        mouseCursor.classList.add("greyscale");
        });
        });

        window.addEventListener('scroll', function(){
            let navbar = document.querySelector('nav');
            navbar.classList.toggle('scroll', window.scrollY > 0);
        })
    </script>
</body>
</html>
