<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Color Flow | Pic your favourite color</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Outfit:wght@100;200;300;400;500;600;700;800;900&family=Space+Grotesk:wght@300;400;500;600;700&display=swap"

    <script src="script.js"></script>

<body>
    <!-- one -->
    <section class="one">
        <div class="homepage">
            <div class="col-1">
                <img src="/Color web project/Files/Logo.png" alt="Logo" class="logo">

                <button class="homepage-btn btn">Explore Colors</button>

            </div>
            <div class="col-2">
                <img src="/Color web project/Files/ABSTRACT.png" class="colorBubble" alt="">
            </div>
        </div>
    </section>
    <!-- one -->

    <!-- two -->
    <section class="two">
        <div>
            <p class="heading">Generate Colors</p>
            <div class="colorbox" onclick= "generator()"><p>Tap to generate</p></div>
            <button onclick="copyText()" class="btn btn1">Copy <span class="hex"></span></button>
        </div>
    </section>
    <!-- two -->
