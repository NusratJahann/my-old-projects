<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Its Magic!! its magic!</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+Display:ital,wght@1,900&display=swap" rel="stylesheet">
    <style>
        *{
            margin: 0;
            padding: 0;
            font-family: 'Noto Serif Display', serif;
        }
        body{
            height: 950vh;
            background: linear-gradient(55deg, rgb(255, 255, 255) 0%, rgb(255, 255, 255) 10%, rgb(255, 254, 219) 20%, rgba(255,196,0,1) 47%, rgba(234,38,38,1) 70%, rgba(38,46,182,1) 100%);
        }
        div{
            display: flex;
            justify-content: center;
            align-items: center;
            position: fixed;
            height: 100vh;
            width: 100vw;
        }
        body h1{
            color: white;
            text-align: center;
            font-size: 30px;
            width: auto;
        }
        body h1 span{
            font-size: 50px;
            text-transform: uppercase;
            letter-spacing: 2px;
            -webkit-text-stroke: 1px rgb(255, 255, 255);
            color: rgba(255, 255, 255, 0.39);
            transition: all 0.5s;
        }
        body h1 span:hover{
            color: white;
            -webkit-text-stroke: 0px;
        }
        @media screen and (max-width: 500px) {
            body h1{
                width: 70%;
            }            
        }
    </style>
</head>
<body>
    <div>
        <h1>Scroll down<br><span>to see magic</span></h1>
    </div>
</body>
</html>
