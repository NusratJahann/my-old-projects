<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Lobster&family=Poppins:wght@400;500&display=swap"
        rel="stylesheet">
    <!-- font awesome -->
    <link rel="stylesheet" href="https://use.fontawesome.com/releases/v5.15.4/css/all.css"
        integrity="sha384-DyZ88mC6Up2uqS4h/KRgHuoeGwBcD4Ng9SiP4dIRy0EXTlnuz47vAwmeGwVChigm" crossorigin="anonymous">
    <!-- Stylesheet -->
    <link rel="stylesheet" href="./style.css">
    <title>Pepsi-Website | Resposive</title>
</head>

<body>

    <nav>
        <a href=""><img class="logo" src="./img/logo.png" alt=""></a>
        <ul>
            <div class="dropdown-container">
                <li class="product-view">View Product<i class="fas fa-angle-down"></i></li>
                <div class="dropdown-content">
                    <div class="products">
                        <div class="product-container">
                            <img src="./img/can-pepsi-1.png" alt="">
                            <p>Pepsi</p>
                        </div>
                        <div class="product-container">
                            <img src="./img/can-pepsi-2.png" alt="">
                            <p>Pepsi Zero Sugar</p>
                        </div>
                        <div class="product-container">
                            <img src="./img/can-pepsi-3.png" alt="">
                            <p>Diet Pepsi</p>
                        </div>
                        <div class="product-container">
                            <img src="./img/can-pepsi-4.png" alt="">
                            <p>Pepsi Mango</p>
                        </div>
                        <div class="product-container">
                            <img src="./img/can-pepsi-5.png" alt="">
                            <p>Pepsi Wild Cherry</p>
                        </div>
                        <div class="more-product-btn">
                            <i class="fas fa-arrow-right"></i>
                            <p>See more product</p>
                        </div>
                    </div>
                </div>
            </div>
            <li class="none"><a href="">What's new</a></li>
            <li class="none"><a href="">Newsletter</a></li>
            <li class="none"><a href="">Contact</a></li>

            <li class="menubar"><i class="fas fa-bars"></i></li>
        </ul>
    </nav>

    <main>
        <section>
            <img src="./img/pepsiCan.png" alt="">
        </section>
        <article>
            <h1 class="main-heading">Pepsi Zero Sugar <br>Mango</h1>
            <h2>Pepsi with a splash of mango</h2>
            <button>Buy Now</button>
        </article>
    </main>

</body>

</html>
