<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=q, initial-scale=1.0">

    <link href="https://cdn.jsdelivr.net/npm/remixicon@2.5.0/fonts/remixicon.css" rel="stylesheet">
    <title>Quantity</title>
    <style>
        * {
            margin: 0;
            padding: 0;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            height: 100vh;
            font-family: "Poppins", sans-serif;
        }

        h1 {
            font-size: 40px;
            margin-bottom: 10px;
        }
        i{
            cursor: pointer;
            width: fit-content;
            height: fit-content;
        }
        div{
            display: flex;
            align-items: center;
        }
        input{
            text-align: center;
            width: 60px;
            font-size: 16px;
            padding: 2px 3px 2px 15px;
            background-color: whitesmoke;
            border: none;
            border-radius: 5px;
        }
        p{
            margin-right: 10px;
        }
        section{
            display: flex;
            align-items: flex-end;
            flex-direction: column;
        }
    </style>
</head>

<body>
    <main>
        <section>
            <h1>$<span class="price">500</span></h1>
        <div>
            <p>Quantity:</p>
            <i class="arrowLeft ri-arrow-drop-left-line"></i>
            <input class="quantity" type="number" min="1">
            <i class="arrowRight ri-arrow-drop-right-line"></i>
        </div>
        </section>
    </main>


    <script>
        let price = document.querySelector(".price");
        let arrowLeft = document.querySelector(".arrowLeft");
        let arrowRight = document.querySelector(".arrowRight");
        let quantity = document.querySelector(".quantity");
        

        function updateQuantity(isIncreasing){
            let inputBox = quantity.value;

            if(isIncreasing == true){
                inputBox = parseInt(inputBox) + 1;
            } else if(inputBox > 0){
                inputBox = parseInt(inputBox) - 1;
            }

            quantity.value = inputBox;
            price.innerText = 500 * inputBox;
        }

        arrowRight.addEventListener("click", function(){
            updateQuantity(true);
        });
        arrowLeft.addEventListener("click", function(){
            updateQuantity(false);
        });

        

          
    </script>
</body>

</html>
