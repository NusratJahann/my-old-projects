<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>English Dictionary</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    
    <div class="container">
        <h2 class="heading">English Dictionary</h2>
        <div class="inputBox">
            <input id="input" type="text" placeholder="Type any word">
            <i class="fa fa-search"></i>
            <i class="fa fa-cross"></i>
        </div>
        <p>Can't find the meaning "bla". Try another word</p>
        <div class="dictionary">
            <div class="pronounce sections">
                <p>/Nothing/Blah</p>
                <h2>"Bla"</h2>
            </div>
            <div class="defination sections">
                <h2>Defination</h2>
                <p>something weird</p>
            </div>
           <div class="sympones sections">
                <h2>Sympones</h2>
                <span>nothing</span>,
                <span>nothing</span>,
                <span>nothing</span>,
                <span>Bruh</span>
            </div>
        </div>
    </div>

    <script src="./script.js"></script>
</body>
</html>
