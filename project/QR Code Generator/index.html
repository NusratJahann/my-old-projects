<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600&display=swap" rel="stylesheet"> 
    <link rel="stylesheet" href="style.css">
    <title>QR Code Generator</title>
</head>
<body>
    <div class="container">
        <img id="qrcode" src="https://api.qrserver.com/v1/create-qr-code/?size=150x150&data=Example">
        <textarea placeholder="Type text" rows="1" id="data"></textarea>
        <div class="btn-container">
                <button id="get-btn" onclick="genQRCODE()">Get QR Code</button>
                <button id="download-btn">Download(jpg)</button>
        </div>
    </div>

    <!-- <script src="./qrcode.min.js"></script> -->
    <script src="./script.js"></script>
</body>
</html>
