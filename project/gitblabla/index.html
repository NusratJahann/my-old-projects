<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stop watch & alarm</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,500;1,400;1,700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/remixicon@2.5.0/fonts/remixicon.css" rel="stylesheet">

    <link rel="stylesheet" href="style.css">
    <script src="script.js"></script>

</head>
<body>
    <div class="container">

        <p>Stop watch</p>

        <h1>
            <span id="hr">00</span>:<span id="min">00</span>:<span id="sec">00</span><span id="ms">00</span>
        </h1>

        <div class="btn-container">
            <button id="btn-start"><i class="ri-play-fill"></i></button>
            <button id="btn-stop"><i class="ri-stop-mini-fill"></i></button>
            <button id="btn-reset"><i class="ri-restart-line"></i></button>
        </div>
    </div>
</body>
</html>
