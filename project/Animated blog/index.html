<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Animated blob</title>
    <script src="https://cdn.jsdelivr.net/npm/kute.js@2.1.2/dist/kute.min.js"></script>
    <style>
        * {
            font-family: "Poppins", sans-serif;
            margin: 0;
            padding: 0;
        }
        body{
            overflow: hidden;
        }
        section {
            width: 100%;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #0f111f;
        }

        h1 {
            color: #f0f0f0;
            font-size: 70px;
            z-index: 1;
        }
        svg{
            top: 0;
            left: 0;
            position: absolute;
        }
    </style>
</head>

<body>
    <section>
        <h1 class="blob-content">Animated Blob</h1>


        <svg id="visual" viewBox="0 0 1920 1080" width="1920" height="1080"
            xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1">
            <g transform="translate(1920, 1080)">
                <path class="blob1" d="M-702 0C-703.8 -103.3 -705.6 -206.7 -648.6 -268.6C-591.6 -330.6 -475.8 -351.2 -405.2 -405.2C-334.6 -459.1 -309.1 -546.4 -249.1 -601.4C-189.1 -656.5 -94.6 -679.2 0 -702L0 0Z" fill="#FBAE3C"></path>

                <path class="blob1" d="M702 0C695.5 93.1 688.9 186.3 648.6 268.6C608.2 351 533.9 422.6 454 454C374 485.3 288.2 476.3 211.6 510.9C135 545.5 67.5 623.8 0 702L0 0Z" fill="#FBAE3C"></path>
            </g>

            <g transform="translate(1920, 1080)" style="visibility: hidden;">
                <path class="blob2" d="M-702 0C-623.3 -61 -544.5 -122 -523.8 -217C-503.1 -311.9 -540.5 -440.8 -496.4 -496.4C-452.3 -551.9 -326.7 -534.1 -230.4 -556.2C-134.1 -578.2 -67 -640.1 0 -702L0 0Z" fill="#FBAE3C">
                </path>

                <path class="blob2" d="M702 0C704.6 108 707.2 216 639.3 264.8C571.5 313.6 433.2 303.1 369.8 369.8C306.4 436.5 317.8 580.3 268.6 648.6C219.5 716.8 109.7 709.4 0 702L0 0Z" fill="#FBAE3C">
                </path>
            </g>
        </svg>

    </section>

    <script>
        const tween = KUTE.fromTo(
            '.blob1', {
                path: '.blob1'
            }, {
                path: '.blob2'
            }, {
                repeat: 999,
                duration: 3000,
                yoyo: true,
            }
        ).start();
    </script>

</body>

</html>
